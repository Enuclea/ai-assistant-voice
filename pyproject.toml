[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant-voice"
version = "0.1.0"
description = "Direct SIP-TLS/SRTP to Realtime LLM Voice & SMS Bridge with Local (stdio) and Remote (Streamable HTTP) MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "anyio>=4.4.0",
]

[project.scripts]
ai-assistant-voice = "ai_assistant_voice.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
